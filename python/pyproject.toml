[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "repomentor-core"
version = "0.1.0"
description = "Headless repository-learning agent core and Claude SDK report runtime"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic==2.13.5", "claude-agent-sdk==0.2.158"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.8"]

[project.scripts]
repomentor = "repomentor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repomentor = ["assets/**/*", "assets/plugin/.claude-plugin/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not ts_parity and not live'"
markers = [
    "live: explicitly requested network/model integration tests",
    "ts_parity: optional historical TS comparison; requires Node and root npm dependencies",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
