[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "repomentor-core"
version = "0.1.0"
description = "Repository-learning assistant with OpenAI Agents SDK, local RAG and reproducible evaluation"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic==2.13.5", "openai-agents==0.23.1", "openai==3.24.0", "httpx2==2.13.0", "claude-agent-sdk==0.2.158", "httpx==0.28.1", "jsonschema==4.26.0", "tokenizers==0.23.2", "tree-sitter==0.26.0", "tree-sitter-python==0.25.0", "tree-sitter-javascript==0.25.0", "tree-sitter-typescript==0.23.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.8"]
rag = ["torch==2.8.0", "transformers==5.17.0", "faiss-cpu==1.15.1", "numpy==2.5.3"]

[project.scripts]
repomentor = "repomentor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repomentor = ["assets/**/*", "assets/plugin/.claude-plugin/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not ts_parity and not live'"
markers = [
    "live: explicitly requested network/model integration tests",
    "ts_parity: optional historical TS comparison; requires Node and root npm dependencies",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
