name: Python core (offline tests)

on:
  push:
    paths: ['python/**', '.github/workflows/python.yml']
  pull_request:
    paths: ['python/**', '.github/workflows/python.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python package and test dependencies
        run: python -s -m pip install -e '.[dev]'
      - name: Check dependencies and code
        run: |
          python -s -m pip check
          python -s -m ruff check src scripts tests
          python -s -m ruff format --check src scripts tests
      - name: Run offline tests (no model credentials)
        env:
          REPOMENTOR_PY_SETTINGS: ${{ github.workspace }}/python/config/model-settings.example.json
        run: python -s -m pytest -q
      - name: Verify recorded reports without API calls
        run: python -s scripts/verify_recorded_results.py
